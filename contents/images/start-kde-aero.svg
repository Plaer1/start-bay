<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="2 2 44 44">
  <!-- Start Bay glass orb with the original artwork from start-button.png. -->
  <defs>
    <linearGradient id="glass" x1="9" y1="4" x2="38" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bad9eb" stop-opacity="0.91"/>
      <stop offset="0.43" stop-color="#416b9b" stop-opacity="0.91"/>
      <stop offset="0.72" stop-color="#183657" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#608cad" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="rim" x1="10" y1="5" x2="37" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edffff"/>
      <stop offset="0.45" stop-color="#5ee6ef"/>
      <stop offset="1" stop-color="#073c63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="4" x2="0" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- A dark edge keeps the glass silhouette visible on pale panels. -->
  <circle cx="24" cy="24" r="21.5" fill="#07334d" fill-opacity="0.92"/>
  <circle cx="24" cy="24" r="20.3" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.2"/>
  <path d="M5.6 22.9C6.2 12.8 13.9 5.3 24 5.3c9.1 0 16.1 5.8 18.1 14.2-5.3-3.2-10.9-3.7-17.7-1.2-7.9 2.9-12.9 5.6-18.8 4.6z" fill="url(#shine)"/>
  <path d="M9.8 34.3c5.4 4.1 12.3 5.9 19.3 4.3 3.5-.8 6.4-2.3 8.8-4.4-2.9 4.6-8 7.7-13.9 7.7-5.9 0-11.1-3-14.2-7.6z" fill="#8cfff0" fill-opacity="0.35"/>
  <image x="1" y="1" width="46" height="46"
         xlink:href="data:image/png;base64,"/>
  <path d="M12.1 12.8c2.3-2.2 5.1-3.6 8.3-4.2" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.4" stroke-linecap="round"/>
